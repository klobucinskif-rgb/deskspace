<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Deskspace</title>
<meta name="theme-color" content="#cfe4fa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="js/theme.js?v=v19-11180014"></script>
<link rel="stylesheet" href="css/base.css?v=v19-11180014">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; min-height: 100%; }
  .aurora { position: fixed; }
  .top, main { position: relative; z-index: 1; }
  .top { display: flex; gap: 14px; align-items: center; padding: 18px 24px; font-size: 14px; }
  .top a.back { color: var(--ink-2); transition: color 0.2s; }
  .top .theme-btn { margin-left: auto; }
  .top a.back:hover { color: var(--ink); }
  main { flex: 1; display: grid; place-items: center; padding: 24px 20px 64px; }
  .card { width: 100%; max-width: 400px; padding: 40px 36px 32px; border-radius: 20px; background: var(--glass); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); box-shadow: var(--shadow-lg), 0 0 0 1px var(--hair); animation: card-in 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  @keyframes card-in { from { opacity: 0; transform: translateY(14px); } }
  .card .mark { width: 52px; height: 52px; margin: 0 auto 22px; border-radius: 26%; box-shadow: 0 14px 28px -12px rgba(31, 111, 208, 0.55); }
  h1 { font-size: 27px; font-weight: 600; letter-spacing: -0.03em; text-align: center; line-height: 1.15; }
  .sub { margin-top: 8px; text-align: center; font-size: 15px; color: var(--ink-2); }
  form { margin-top: 28px; display: flex; flex-direction: column; gap: 14px; }
  label { display: block; font-size: 13px; font-weight: 500; color: var(--ink-2); margin-bottom: 6px; }
  input { width: 100%; height: 44px; padding: 0 14px; border-radius: 11px; border: 1px solid var(--line-2); background: var(--surface); font-size: 16px; outline: 0; transition: border-color 0.15s, box-shadow 0.15s; }
  input::placeholder { color: var(--faint); }
  input:focus { border-color: var(--sky-500); box-shadow: 0 0 0 4px var(--ring); }
  .field[hidden] { display: none; }
  .btn { width: 100%; height: 46px; margin-top: 6px; border-radius: 11px; font-size: 16px; }
  .err { font-size: 13px; color: var(--red); min-height: 18px; margin: -4px 0 -6px; }
  .or { display: flex; align-items: center; gap: 12px; margin: 20px 0 14px; font-size: 12.5px; color: var(--muted); }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .swap { margin-top: 22px; text-align: center; font-size: 14px; color: var(--ink-2); }
  .swap button { color: var(--blue); font-weight: 500; }
  .swap button:hover { text-decoration: underline; text-underline-offset: 3px; }
  .join-note { display: none; margin-top: 18px; padding: 12px 14px; border-radius: 12px; background: var(--sky-100); color: var(--ink-2); font-size: 13px; line-height: 1.45; text-align: center; }
  .join-note.on { display: block; animation: card-in 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s both; }
  .join-note b { display: block; margin-top: 4px; color: var(--blue); font: 600 18px var(--mono); letter-spacing: 0.08em; }
  .pw { position: relative; }
  .pw input { padding-right: 44px; }
  .eye { position: absolute; right: 6px; top: 6px; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); transition: color 0.2s, background 0.2s; }
  .eye:hover, .eye.on { color: var(--blue); background: var(--fill); }
  .eye svg { width: 18px; height: 18px; }
  .keep { display: flex; align-items: center; gap: 9px; margin: -2px 0 0; font-size: 13.5px; font-weight: 400; color: var(--ink-2); cursor: pointer; user-select: none; }
  .keep input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .keep .tick { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px var(--line-2); color: transparent; background: var(--surface); transition: background 0.2s, box-shadow 0.2s, color 0.2s; }
  .keep .tick svg { width: 12px; height: 12px; }
  .keep input:checked + .tick { background: var(--accent); box-shadow: none; color: var(--on-accent); }
  .keep input:focus-visible + .tick { box-shadow: 0 0 0 3px var(--ring), inset 0 0 0 1.5px var(--sky-500); }
  .btn.busy { opacity: 0.75; pointer-events: none; }
  .link-btn { color: var(--blue); font-weight: 500; }
  .link-btn:hover { text-decoration: underline; text-underline-offset: 3px; }
  .recent { margin-top: 22px; display: flex; flex-direction: column; gap: 6px; }
  .recent[hidden] { display: none; }
  .rc-h { font-size: 12px; font-weight: 600; color: var(--muted); }
  .rc { position: relative; }
  .rc-pick { width: 100%; display: flex; align-items: center; gap: 11px; padding: 9px 40px 9px 10px; border-radius: 12px; text-align: left; background: var(--surface); box-shadow: 0 0 0 1px var(--line); transition: box-shadow 0.2s, transform 0.25s; }
  .rc-pick:hover { box-shadow: 0 0 0 1px var(--sky-400); transform: translateY(-1px); }
  .rc-pick.on { box-shadow: 0 0 0 2px var(--sky-500); }
  .rc-pick img, .rc-av { width: 34px; height: 34px; border-radius: 50%; flex: none; object-fit: cover; }
  .rc-av { display: grid; place-items: center; background: var(--sky-200); color: var(--blue); font-weight: 600; font-size: 14px; }
  .rc-t { min-width: 0; }
  .rc-t b { display: block; font-size: 14px; font-weight: 600; color: var(--ink); }
  .rc-t small { display: block; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rc-x { position: absolute; right: 8px; top: 50%; width: 26px; height: 26px; margin-top: -13px; border-radius: 50%; color: var(--muted); font-size: 18px; line-height: 1; }
  .rc-x:hover { background: var(--fill); color: var(--ink); }
  .err .link-btn { font-size: 13px; }
  .demo { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); text-align: center; font-size: 12.5px; line-height: 1.45; color: var(--muted); }
  @media (max-width: 460px) { .card { padding: 32px 22px 26px; } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 40 40">
    <linearGradient id="mark-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fc5f7"/><stop offset="1" stop-color="#4896e6"/></linearGradient>
    <rect width="40" height="40" rx="10" fill="url(#mark-g)"/>
    <clipPath id="mark-d"><path d="M13 10h7a10 10 0 0 1 0 20h-9V12a2 2 0 0 1 2-2z"/></clipPath>
    <g clip-path="url(#mark-d)">
      <rect x="9" y="8" width="24" height="24" fill="#fff"/>
      <path d="M9 23.5c3.5-3.4 7.5-3.4 11-.8s7.5 2.8 12-1.2V32H9z" fill="#bcdcfa"/>
      <path d="M9 26.5c3.5-2.6 7.5-2.6 11-.6s7.5 2.2 12-1V32H9z" fill="#6aaeee"/>
    </g>
  </symbol>
</svg>

<div class="aurora flat" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="top">
  <a class="logo" href="index.html" aria-label="Deskspace home"><svg><use href="#mark"/></svg><span>Desk<span class="space">space</span></span></a>
  <button class="theme-btn" type="button" data-theme-toggle aria-label="Switch between light and dark theme" title="Light / dark"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5V5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
  <a class="back" href="index.html">Back to site</a>
</header>

<main>
  <div class="card">
    <svg class="mark" aria-hidden="true"><use href="#mark"/></svg>
    <h1 id="title">Sign in to Deskspace</h1>
    <p class="sub" id="sub">Pick up where your projects left off.</p>
    <p class="join-note" id="join-note" role="status"></p>
    <div class="recent" id="recent" hidden></div>
    <form id="form" method="post" action="#" novalidate>
      <div class="field" id="f-name" hidden>
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" autocomplete="name" placeholder="Ana Petrova">
      </div>
      <div class="field">
        <label for="email">Work email</label>
        <input id="email" name="email" type="email" autocomplete="username" placeholder="you@studio.com" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="pw">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="At least 8 characters" required minlength="8">
          <button type="button" class="eye" id="eye" aria-label="Show password" title="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <label class="keep"><input type="checkbox" id="keep" checked><span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Keep me signed in on this device</label>
      <p class="err" id="err" role="alert"></p>
      <button class="btn btn-primary" type="submit" id="submit">Sign in</button>
    </form>
    <p class="swap"><span id="swap-q">New to Deskspace?</span> <button type="button" id="swap">Create an account</button></p>
    <p class="demo">Your account and its workspace are saved in this browser. <button type="button" class="link-btn" id="demo">Try the sample workspace</button></p>
  </div>
</main>
<script>
(function () {
  var KEY = 'deskspace-user', ACC = 'deskspace-accounts';
  var $ = function (id) { return document.getElementById(id); };
  function session() { try { return JSON.parse(localStorage.getItem(KEY) || sessionStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }
  var s0 = session(); if (s0 && s0.email) { location.replace('app.html'); return; }
  function accounts() { try { return JSON.parse(localStorage.getItem(ACC) || '{}') || {}; } catch (e) { return {}; } }
  function saveAccounts(a) { localStorage.setItem(ACC, JSON.stringify(a)); }
  function esc(t) { return String(t).replace(/[&<>"']/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]; }); }
  function hex(buf) { return [].map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
  function randomSalt() { var a = new Uint8Array(16); crypto.getRandomValues(a); return hex(a.buffer); }
  // The password never gets stored: only a salted PBKDF2 hash of it.
  function hashPw(pw, salt) {
    if (!window.crypto || !crypto.subtle) return Promise.reject(new Error('no-crypto'));
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']).then(function (k) {
      return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(salt), iterations: 150000, hash: 'SHA-256' }, k, 256);
    }).then(hex);
  }
  function startSession(acc, keep) {
    var u = { name: acc.name, email: acc.email };
    if (acc.photo) u.photo = acc.photo;
    try { localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); (keep ? localStorage : sessionStorage).setItem(KEY, JSON.stringify(u)); }
    catch (err) { $('err').textContent = 'This browser is blocking storage, so it cannot keep you signed in.'; return false; }
    return true;
  }

  function enterDemo() {
    try { localStorage.setItem(KEY, JSON.stringify({ name: 'Ana Petrova', email: 'ana@haldenstudio.co', demo: true })); }
    catch (err) { $('err').textContent = 'This browser is blocking storage, so the sample workspace cannot open.'; return; }
    location.replace('app.html');
  }
  if (/[?&]demo=1/.test(location.search)) { enterDemo(); return; }
  $('demo').addEventListener('click', enterDemo);

  var signup = /[?&]new=1/.test(location.search);
  var jm = location.search.match(/[?&]join=([A-Za-z0-9-]{5,20})/);
  if (jm) {
    var jn = $('join-note'); jn.classList.add('on');
    jn.innerHTML = 'You have an invite to a team on Deskspace. Sign in, then use “Join with code” on the Team page with this code:<b></b>';
    jn.querySelector('b').textContent = jm[1].toUpperCase();
  }

  // accounts that signed in here before, newest first
  function paintRecent() {
    var A = accounts(), list = Object.keys(A).map(function (k) { return A[k]; }).filter(function (a) { return !a.hidden; }).sort(function (a, b) { return (b.last || 0) - (a.last || 0); }).slice(0, 3), box = $('recent');
    box.hidden = signup || !list.length;
    if (box.hidden) return;
    box.innerHTML = '<div class="rc-h">Signed in here before</div>' + list.map(function (a) {
      var ini = (a.name || a.email).trim().charAt(0).toUpperCase();
      return '<div class="rc"><button type="button" class="rc-pick" data-email="' + esc(a.email) + '">' + (a.photo ? '<img src="' + esc(a.photo) + '" alt="">' : '<span class="rc-av">' + esc(ini) + '</span>') +
        '<span class="rc-t"><b>' + esc(a.name) + '</b><small>' + esc(a.email) + '</small></span></button>' +
        '<button type="button" class="rc-x" data-forget="' + esc(a.email) + '" aria-label="Remove ' + esc(a.email) + ' from this list" title="Remove from this list">&times;</button></div>';
    }).join('');
  }
  $('recent').addEventListener('click', function (e) {
    var f = e.target.closest('[data-forget]');
    if (f) {
      var A = accounts(), k = f.getAttribute('data-forget').toLowerCase();
      if (A[k]) { A[k].last = 0; A[k].hidden = true; }
      // keep the account itself, only drop it from the quick list
      saveAccounts(A); f.closest('.rc').remove(); if (!$('recent').querySelector('.rc')) $('recent').hidden = true; return;
    }
    var p = e.target.closest('[data-email]');
    if (p) { $('email').value = p.getAttribute('data-email'); $('password').value = ''; $('password').focus(); [].forEach.call(document.querySelectorAll('.rc-pick'), function (b) { b.classList.toggle('on', b === p); }); }
  });

  function paint() {
    $('title').textContent = signup ? 'Create your Deskspace account' : 'Sign in to Deskspace';
    $('sub').textContent = signup ? 'Start with a free workspace. Upgrade when the team grows.' : 'Pick up where your projects left off.';
    $('f-name').hidden = !signup;
    $('submit').textContent = signup ? 'Create account' : 'Sign in';
    $('swap-q').textContent = signup ? 'Already have an account?' : 'New to Deskspace?';
    $('swap').textContent = signup ? 'Sign in' : 'Create an account';
    $('password').autocomplete = signup ? 'new-password' : 'current-password';
    $('password').placeholder = 'At least 8 characters';
    $('err').textContent = '';
    paintRecent();
  }
  $('swap').addEventListener('click', function () { signup = !signup; paint(); (signup ? $('name') : $('email')).focus(); });
  $('eye').addEventListener('click', function () {
    var pw = $('password'), show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    this.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); this.title = show ? 'Hide password' : 'Show password'; this.classList.toggle('on', show);
    pw.focus();
  });

  var busy = false;
  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy) return;
    var email = $('email').value.trim(), key = email.toLowerCase(), name = $('name').value.trim(), pw = $('password').value, keep = $('keep').checked, A = accounts(), acc = A[key];
    $('err').textContent = '';
    if (signup && !name) { $('err').textContent = 'Enter your name.'; $('name').focus(); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { $('err').textContent = 'Enter a valid email address.'; $('email').focus(); return; }
    if (signup && acc) { $('err').textContent = 'There is already an account with this email. Sign in instead.'; return; }
    if (!signup && !acc) { $('err').innerHTML = 'No account uses this email on this device. <button type="button" class="link-btn" id="go-new">Create one</button>'; $('go-new').onclick = function () { signup = true; paint(); $('name').focus(); }; return; }
    if (pw.length < 8) { $('err').textContent = signup ? 'Use at least 8 characters for the password.' : 'Enter your password.'; $('password').focus(); return; }
    busy = true; $('submit').classList.add('busy'); $('submit').textContent = signup ? 'Creating account…' : 'Signing in…';
    var salt = signup ? randomSalt() : acc.salt;
    hashPw(pw, salt).then(function (h) {
      if (signup) { acc = { name: name, email: email, salt: salt, hash: h, created: Date.now() }; }
      else if (h !== acc.hash) { throw new Error('wrong'); }
      acc.last = Date.now(); acc.hidden = false; A[key] = acc; saveAccounts(A);
      if (startSession(acc, keep)) location.href = 'app.html';
      else { busy = false; paint(); }
    }).catch(function (err) {
      busy = false; $('submit').classList.remove('busy'); paint();
      $('err').textContent = err && err.message === 'wrong' ? 'That password is not right. Try again.' : err && err.message === 'no-crypto' ? 'This browser cannot sign you in securely. Open the site over https.' : 'Something went wrong. Try again.';
      $('password').select();
    });
  });
  paint();
  var first = document.querySelector('.rc-pick');
  if (first && !signup) first.focus(); else $(signup ? 'name' : 'email').focus();
})();
</script>
</body>
</html>
